      /* Fluid Morphing Liquid Background Blobs */
      .liquid-blobs {
        position: fixed;
        inset: 0;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
      }

      .blob {
        position: absolute;
        filter: blur(110px);
        opacity: 0.38;
        animation: morphBlob 22s ease-in-out infinite alternate;
      }

      [data-theme="light"] .blob {
        opacity: 0.28;

      .blob-1 {
        width: 580px;
        height: 580px;

        background: radial-gradient(circle, #06b6d4 0%, #2dd4bf 60%, transparent 100%);
        animation-duration: 25s;
        animation-delay: -10s;
      }

      @keyframes morphBlob {
        0% {
          border-radius: 42% 58% 65% 35% / 45% 40% 60% 55%;
          transform: translate(0, 0) scale(1) rotate(0deg);
        }
        50% {
          border-radius: 64% 36% 42% 58% / 58% 62% 38% 42%;
          transform: translate(65px, -45px) scale(1.12) rotate(120deg);
        }
        100% {

      /* =========================================================

      .liquid-glass {

        box-shadow: var(--liquid-shadow);
        position: relative;

          box-shadow 0.35s ease,
          border-color 0.35s ease;
      }

      /* Top Glossy Specular Rim Highlight */
      .liquid-glass::before {
        content: "";
        position: absolute;
        top: 0;
        left: 8%;
        right: 8%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--liquid-highlight) 50%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 2;
      }

      /* Dynamic Cursor-Following Refraction Sheen */
      .liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          420px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
          var(--spotlight-color),
          transparent 55%
        );
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
        z-index: 1;
      }

      .liquid-glass:hover::after {

    <script>
      // Global references for Theme-Aware Three.js Scene
      let threeSceneState = null;

      /**
       * Scroll-Scrubbed Apple-Style Manifesto Text Reveal
       * Splits heading into word spans and smoothly illuminates each word
       * based on scroll progress while the container stays pinned in view.
       */
      function initManifestoScrub() {
        const section = document.getElementById("manifesto");
        const heading = document.getElementById("manifesto-text");
        const bar = document.getElementById("manifesto-bar");
        if (!section || !heading) return;

        const accentSet = new Set(
          (heading.getAttribute("data-accent-words") || "").split(",")
        );
        const words = heading.textContent.trim().split(/\s+/);

        heading.innerHTML = words
          .map(
            (word, idx) =>
              `<span class="manifesto-word" data-word-index="${idx}" data-is-accent="${
                accentSet.has(word) ? "1" : "0"
              }">${word}</span>`
          )
          .join(" ");

        const wordEls = Array.from(heading.querySelectorAll(".manifesto-word"));

        function updateManifesto() {
          const rect = section.getBoundingClientRect();
          const totalTravel = Math.max(1, section.offsetHeight - window.innerHeight * 0.65);
          const scrolled = Math.max(0, window.innerHeight * 0.35 - rect.top);
          const progress = Math.min(1, Math.max(0, scrolled / totalTravel));

          const litCount = Math.floor(progress * (wordEls.length + 1));
          wordEls.forEach((el, idx) => {
            const isAccent = el.getAttribute("data-is-accent") === "1";
            if (idx < litCount) {
              el.classList.add(isAccent ? "lit-accent" : "lit");
            } else {
              el.classList.remove("lit", "lit-accent");
            }
          });

          if (bar) {
            bar.style.width = `${(progress * 100).toFixed(1)}%`;
          }
        }

        window.addEventListener("scroll", updateManifesto, { passive: true });
        window.addEventListener("resize", updateManifesto, { passive: true });
        updateManifesto();
      }

      /**
       * Pinned Sticky Stacking Cards 3D Depth Engine
       * Smoothly scales down & dims covered cards as the next card glides over them,
       * and updates the pinned left-column active counter ("01 / 04") & step pills.
       */
      function initStickyStackCards() {
        const cards = Array.from(document.querySelectorAll(".stack-card"));
        const counterEl = document.getElementById("stack-active-counter");
        const stepPills = Array.from(document.querySelectorAll(".stack-step-pill"));
        if (!cards.length) return;

        const supportsFineHover = window.matchMedia(
          "(hover: hover) and (pointer: fine)"
        ).matches;

        function updateStack() {
          let activeIdx = 0;

          cards.forEach((card, i) => {
            const rect = card.getBoundingClientRect();
            const stickyTop = parseFloat(getComputedStyle(card).top) || 100;

            if (rect.top <= stickyTop + 40) {
              activeIdx = i;
            }

            // Skip transform override if desktop user is actively hovering this card
            if (supportsFineHover && card.matches(":hover")) return;

            const nextCard = cards[i + 1];
            if (nextCard) {
              const nextRect = nextCard.getBoundingClientRect();
              const overlapStart = stickyTop + 320;
              const overlapEnd = stickyTop + 28;
              const overlapProgress = Math.min(
                1,
                Math.max(0, (overlapStart - nextRect.top) / (overlapStart - overlapEnd))
              );

              const scale = 1 - overlapProgress * 0.065;
              const brightness = 1 - overlapProgress * 0.22;
              card.style.transform = `scale(${scale.toFixed(3)})`;
              card.style.filter = `brightness(${brightness.toFixed(3)})`;
            } else {
              card.style.transform = "scale(1)";
              card.style.filter = "brightness(1)";
            }
          });

          if (counterEl) {
            counterEl.textContent = `0${activeIdx + 1} / 0${cards.length}`;
          }

          stepPills.forEach((pill, idx) => {
            pill.classList.toggle("active", idx === activeIdx);
          });
        }

        window.addEventListener("scroll", updateStack, { passive: true });
        window.addEventListener("resize", updateStack, { passive: true });
        updateStack();
      }

      /**
       * 3D Perspective Tilt & Liquid Spotlight Effect on Cards
       * Automatically disabled on touch devices for silky 60fps mobile scrolling.
       */
      function initLiquidTiltCards() {
        const supportsHover = window.matchMedia(
          "(hover: hover) and (pointer: fine)"
        ).matches;
        if (!supportsHover) return;

        const cards = document.querySelectorAll(".liquid-glass");
        cards.forEach((card) => {
          card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            card.style.setProperty("--mouse-x", `${x}px`);
            card.style.setProperty("--mouse-y", `${y}px`);

            if (card.classList.contains("tilt-card") && window.innerWidth >= 1024) {
              const centerX = rect.width / 2;
              const centerY = rect.height / 2;
              const rotateX = ((y - centerY) / centerY) * -5;
              const rotateY = ((x - centerX) / centerX) * 5;
              card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
            }
          });

          card.addEventListener("mouseleave", () => {
            if (card.classList.contains("tilt-card")) {
              card.style.transform =
                "perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)";
            }
          });
        });
      }

      /**
       * Theme Toggle with LocalStorage Persistence
       */
      function initThemeToggle() {
        const themeToggle = document.getElementById("theme-toggle");
        const themeIcon = document.getElementById("theme-icon");
        const body = document.body;

        const savedTheme = localStorage.getItem("theme") || "dark";
        body.setAttribute("data-theme", savedTheme);
        themeIcon.className = savedTheme === "light" ? "fas fa-sun" : "fas fa-moon";

        themeToggle.addEventListener("click", () => {
          const current = body.getAttribute("data-theme") || "dark";
          const next = current === "dark" ? "light" : "dark";
          body.setAttribute("data-theme", next);
          localStorage.setItem("theme", next);
          themeIcon.className = next === "light" ? "fas fa-sun" : "fas fa-moon";

          if (threeSceneState && threeSceneState.applyThreeTheme) {
            threeSceneState.applyThreeTheme(next);
          }
        });
      }

      // Initialize AOS & App Logic on DOM Ready
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof AOS !== "undefined") {
          AOS.init({
            duration: 900,
            easing: "ease-out-cubic",
            once: true,
            offset: 80,
          });
        }

        initThemeToggle();
        initLiquidTiltCards();
        initDom3DParallax();
        initManifestoScrub();
        initStickyStackCards();
        const mobileMenuButton = document.getElementById("mobile-menu-button");
        const mobileMenu = document.getElementById("mobile-menu");
        if (mobileMenuButton && mobileMenu) {
          mobileMenuButton.addEventListener("click", () =>
            mobileMenu.classList.toggle("hidden")
          );
          document.querySelectorAll("#mobile-menu a").forEach((link) =>
            link.addEventListener("click", () => mobileMenu.classList.add("hidden"))
          );
        }

        // Dynamic Age Calculation (from 1993-06-22)
        function calculateAge() {
          const birthDate = new Date("1993-06-22");
          const today = new Date();
          let age = today.getFullYear() - birthDate.getFullYear();
          const m = today.getMonth() - birthDate.getMonth();
          if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
            age--;
          }
          const ageEl = document.getElementById("dynamic-age");
          if (ageEl) ageEl.textContent = `${age} Years`;
        }

        // Dynamic Experience Calculation (RecruitNXT 9m + StreakByte 3m + Hakimi Digital from 2023-02-01)
        function calculateExperience() {
          const today = new Date();
          const fixedTotalMonths = 9 + 3;
          const hakimiStartDate = new Date("2023-02-01");

          let currentJobYears = today.getFullYear() - hakimiStartDate.getFullYear();
          let currentJobMonths = today.getMonth() - hakimiStartDate.getMonth();

          if (today.getDate() < hakimiStartDate.getDate()) {
            currentJobMonths--;
          }
          if (currentJobMonths < 0) {
            currentJobYears--;
            currentJobMonths += 12;
          }

          const totalMonths = fixedTotalMonths + currentJobYears * 12 + currentJobMonths;
          const totalYears = Math.floor(totalMonths / 12);
          const remainingMonths = totalMonths % 12;

          let experienceString = "";
          if (totalYears > 0) {
            experienceString += `${totalYears} Year${totalYears > 1 ? "s" : ""}`;
          }
          if (remainingMonths > 0) {
            if (totalYears > 0) experienceString += " & ";
            experienceString += `${remainingMonths} Month${remainingMonths > 1 ? "s" : ""}`;
          }

          const experienceEl = document.getElementById("dynamic-experience");
          if (experienceEl) {
            experienceEl.textContent = experienceString || "Starting...";
          }
        }

        calculateAge();
        calculateExperience();

        // Scroll Reveal Intersection Observer
        const scrollObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
              }
            });
          },
          { threshold: 0.1 }
        );
        document
          .querySelectorAll(".scroll-animate")
          .forEach((el) => scrollObserver.observe(el));

        // Counter Animation Observer
        const counterObserver = new IntersectionObserver(
          (entries, obs) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const counter = entry.target;
                const target = +counter.getAttribute("data-target");
                let count = 0;
                const increment = Math.max(1, target / 60);

                const updateCounter = () => {
                  if (count < target) {
                    count = Math.min(target, Math.ceil(count + increment));
                    counter.innerText = count;
                    requestAnimationFrame(updateCounter);
                  } else {
                    counter.innerText = target;
                  }
                };
                updateCounter();
                obs.unobserve(counter);
              }
            });
          },
          { threshold: 0.6 }
        );
        document
          .querySelectorAll(".counter-value")

        const successModal = document.getElementById("success-modal");
        const closeSuccessBtn = document.getElementById("close-success-modal");
        const submitBtn = document.getElementById("form-submit-btn");
        const errorBox = document.getElementById("form-error-box");

        if (contactForm) {
          contactForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.classList.add("hidden");
            errorBox.textContent = "";

            const originalBtnText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerHTML =
              '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Sending...';

            const formData = new FormData(contactForm);

            try {
              const response = await fetch(contactForm.action, {
                method: "POST",
                body: formData,
                headers: {
                  Accept: "application/json",
                },
              });

              if (response.ok) {
                successModal.classList.remove("hidden");
                requestAnimationFrame(() => successModal.classList.add("visible"));
                contactForm.reset();
              } else {
                errorBox.textContent =
                  "Oops! There was a problem submitting your form. Please try again.";
                errorBox.classList.remove("hidden");
              }
            } catch (error) {
              errorBox.textContent =
                "Oops! There was a network error. Please check your connection and try again.";
              errorBox.classList.remove("hidden");
            } finally {
              submitBtn.disabled = false;
              submitBtn.innerText = originalBtnText;
            }
          });
        }

        if (closeSuccessBtn && successModal) {
          const closeSuccess = () => {
            successModal.classList.remove("visible");
            setTimeout(() => successModal.classList.add("hidden"), 300);
          };
          closeSuccessBtn.addEventListener("click", closeSuccess);
          successModal.addEventListener("click", (e) => {
            if (e.target === successModal) closeSuccess();
          });
        }
